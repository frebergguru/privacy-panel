[workspace]
resolver = "3"
members = ["crates/core", "crates/gui", "crates/helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
