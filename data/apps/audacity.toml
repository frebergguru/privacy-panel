[app]
id = "audacity"
name = "Audacity"
icon = "audacity"
desktop = ["audacity", "org.audacityteam.Audacity"]
binaries = ["audacity"]
flatpak = "org.audacityteam.Audacity"
processes = ["audacity"]

[[setting]]
id = "updates"
title = "Check for updates"
explanation = "Audacity contacts audacityteam.org when it starts to look for new versions."
category = "updates"
format = "ini"
files = ["$XDG_CONFIG_HOME/audacity/audacity.cfg", "~/.audacity-data/audacity.cfg"]
group = "Update"
key = "DefaultUpdatesChecking"
type = "bool"
on = "1"
off = "0"
default = true
recommended = false
requires_closed = true
